name: Crowdin Sync

on:
  push:
    branches:
      - main
    paths:
      - 'locales/en/**'
  schedule:
    - cron: '0 0 * * *' # 每天 UTC 0 点自动拉取翻译
  workflow_dispatch: # 允许手动触发

# 下载译文那步需要创建 PR（create_pull_request: true），
# 因此既要 pull-requests: write，也要显式注入 GITHUB_TOKEN（见下方 download step 的 env）。
permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload Sources to Crowdin
        # 限制：只在 push 或手动触发时上传
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: crowdin/github-action@v2
        with:
          upload_sources: true
          upload_translations: true # <--- 关键修正：允许上传已有翻译
          download_translations: false
          project_id: ${{ secrets.CROWDIN_PROJECT_ID }}
          token: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

      - name: Download Translations from Crowdin
        # 定时任务自动拉取；也允许手动触发以便验证回灌链路
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: crowdin/github-action@v2
        with:
          upload_sources: false
          upload_translations: false
          download_translations: true
          create_pull_request: true
          skip_untranslated_files: true # 整篇未翻译的语种（es/fr/ja）不导出
          # 注意：Crowdin CLI 不允许与 skip_untranslated_strings 同时开启
          # （会报 "You cannot skip strings and files at the same time"）
          localization_branch_name: 'crowdin-translations'
          pull_request_title: 'chore: sync translations from Crowdin'
          project_id: ${{ secrets.CROWDIN_PROJECT_ID }}
          token: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
